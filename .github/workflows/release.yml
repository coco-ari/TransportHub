name: Windows Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-test-package-release:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build Release
        shell: powershell
        run: .\scripts\build-desktop.ps1 -Configuration Release

      - name: Run self-tests
        shell: powershell
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'TransportHub-self-test.log'
          $env:TRANSPORTHUB_SELF_TEST_LOG = $log
          $process = Start-Process `
            -FilePath .\artifacts\TransportHub.Desktop\TransportHub.exe `
            -ArgumentList '--self-test' `
            -Wait -PassThru
          if (Test-Path -LiteralPath $log) {
            Get-Content -LiteralPath $log
          }
          if ($process.ExitCode -ne 0) {
            throw "TransportHub self-tests failed with exit code $($process.ExitCode)."
          }

      - name: Install Inno Setup
        shell: powershell
        run: |
          winget install `
            --id JRSoftware.InnoSetup `
            --exact `
            --version 6.7.3 `
            --scope user `
            --source winget `
            --silent `
            --accept-source-agreements `
            --accept-package-agreements `
            --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installation failed with exit code $LASTEXITCODE."
          }

      - name: Build installer
        shell: powershell
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          .\scripts\package-release.ps1 -Version $version

      - name: Publish prerelease
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          gh release create '${{ github.ref_name }}' `
            ".\artifacts\release\TransportHub-Setup-v$version.exe" `
            '.\artifacts\release\SHA256SUMS.txt' `
            --verify-tag `
            --title "TransportHub ${{ github.ref_name }} (Preview)" `
            --notes-file '.\packaging\release-notes.md' `
            --prerelease
