name: Windows CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Build Release
        shell: powershell
        run: .\scripts\build-desktop.ps1 -Configuration Release

      - name: Run self-tests
        shell: powershell
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'TransportHub-self-test.log'
          $env:TRANSPORTHUB_SELF_TEST_LOG = $log
          $process = Start-Process `
            -FilePath .\artifacts\TransportHub.Desktop\TransportHub.exe `
            -ArgumentList '--self-test' `
            -Wait -PassThru
          if (Test-Path -LiteralPath $log) {
            Get-Content -LiteralPath $log
          }
          if ($process.ExitCode -ne 0) {
            throw "TransportHub self-tests failed with exit code $($process.ExitCode)."
          }

      - name: Install Inno Setup
        shell: powershell
        run: |
          winget install `
            --id JRSoftware.InnoSetup `
            --exact `
            --version 6.7.3 `
            --scope user `
            --source winget `
            --silent `
            --accept-source-agreements `
            --accept-package-agreements `
            --disable-interactivity
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installation failed with exit code $LASTEXITCODE."
          }

      - name: Build and verify installer
        shell: powershell
        run: |
          .\scripts\package-release.ps1
          $setups = @(Get-ChildItem -LiteralPath '.\artifacts\release' -Filter 'TransportHub-Setup-v*.exe' -File)
          $checksums = '.\artifacts\release\SHA256SUMS.txt'
          if ($setups.Count -ne 1 -or
              -not (Test-Path -LiteralPath $checksums -PathType Leaf)) {
            throw 'Installer packaging did not create the expected release assets.'
          }
          Get-Content -LiteralPath $checksums

      - name: Verify bootstrap failure is atomic
        shell: powershell
        run: |
          $setup = @(Get-ChildItem -LiteralPath '.\artifacts\release' -Filter 'TransportHub-Setup-v*.exe' -File)
          $installRoot = Join-Path $env:LOCALAPPDATA 'Programs\TransportHub'
          if (Test-Path -LiteralPath $installRoot) {
            throw "Unexpected pre-existing install root: $installRoot"
          }
          $startInfo = [Diagnostics.ProcessStartInfo]::new()
          $startInfo.FileName = $setup[0].FullName
          $startInfo.Arguments = '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART'
          $startInfo.UseShellExecute = $false
          $startInfo.EnvironmentVariables['OS'] = 'INJECTED_FAILURE'
          $process = [Diagnostics.Process]::Start($startInfo)
          if (-not $process.WaitForExit(30000)) {
            throw 'Failure-injection setup timed out.'
          }
          if ($process.ExitCode -eq 0) {
            throw 'The installer reported success after an injected bootstrap failure.'
          }
          if (Test-Path -LiteralPath $installRoot) {
            throw 'The installer left files behind after an injected bootstrap failure.'
          }
